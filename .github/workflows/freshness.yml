name: Source freshness

# Kept out of the PR gates: source reviewBy dates expire on the calendar, not on
# code changes, so this reports staleness on a schedule instead of blocking merges.
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - name: Audit source freshness
        run: npm run audit:freshness
